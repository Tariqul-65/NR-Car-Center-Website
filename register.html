<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Admin Registration | NR Car Center</title>

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

    <link rel="stylesheet" th:href="@{/admin-register.css}" href="/admin-register.css">
</head>
<body>

<div class="topbar">
    <div class="container topbar-row">
        <div class="topbar-left">
            <i class="fa-solid fa-mobile-screen"></i>
            <span>WhatsApp +8801716674547 +8801711578507</span>
        </div>
        <div class="topbar-right">
            <a href="#" aria-label="Facebook"><i class="fa-brands fa-facebook-f"></i></a>
            <a href="#" aria-label="Twitter"><i class="fa-brands fa-twitter"></i></a>
            <a href="#" aria-label="Pinterest"><i class="fa-brands fa-pinterest-p"></i></a>
            <a href="#" aria-label="Instagram"><i class="fa-brands fa-instagram"></i></a>
        </div>
    </div>
</div>

<header class="header">
    <div class="container header-row">
        <div class="brand">
            <img th:src="@{/logo.jpeg}" src="/logo.jpeg" alt="NR Car Center Logo" class="brand-logo">
        </div>
    </div>
</header>

<main class="page">
    <div class="container">
        <div class="auth-wrap">

            <div class="auth-head">
                <h1>Admin Registration</h1>
                <p>Create admin account to manage showroom content.</p>
                <div class="auth-underline"></div>
            </div>

            <div class="auth-card">

                <div class="alert" th:if="${error}" th:text="${error}"></div>

                <form class="form"
                      th:action="@{/register}"
                      method="post"
                      enctype="multipart/form-data"
                      th:object="${registerRequest}">

                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <input type="hidden" th:field="*{inviteToken}"/>

                    <div class="grid">

                        <div class="field">
                            <label>Full Name</label>
                            <input type="text" placeholder="Enter full name" required th:field="*{fullName}">
                        </div>

                        <div class="field">
                            <label>Phone</label>
                            <input type="tel" placeholder="e.g. +88017XXXXXXXX" required th:field="*{phone}">
                        </div>

                        <div class="field">
                            <label>Email</label>
                            <input type="email" placeholder="admin@nrcarcenter.com" required th:field="*{email}">
                        </div>

                        <div class="field">
                            <label>Role</label>
                            <select disabled>
                                <option selected>Assigned by Company</option>
                            </select>
                        </div>

                        <div class="field">
                            <label>Password</label>
                            <div class="input-icon">
                                <input id="pass" type="password" placeholder="Create password" required th:field="*{password}">
                                <button class="eye" type="button" id="togglePass" aria-label="Show password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="field">
                            <label>Confirm Password</label>
                            <div class="input-icon">
                                <input id="cpass" type="password" placeholder="Confirm password" required th:field="*{confirmPassword}">
                                <button class="eye" type="button" id="toggleCPass" aria-label="Show password">
                                    <i class="fa-regular fa-eye"></i>
                                </button>
                            </div>
                        </div>

                        <div class="field full">
                            <label>Address (Optional)</label>
                            <input type="text" placeholder="Office address" th:field="*{address}">
                        </div>

                        <div class="field full">
                            <label>Profile Photo (Optional)</label>
                            <input type="file" name="photo" accept="image/*">
                        </div>

                    </div>

                    <button class="btn" type="submit">
                        <i class="fa-solid fa-user-plus"></i> Create Account
                    </button>

                    <div class="form-foot">
                        <span>Already have an account?</span>
                        <a th:href="@{/login}" href="/login">Login</a>
                    </div>

                </form>
            </div>
        </div>
    </div>
</main>

<footer class="footer">
    <div class="footer-bottom">
        <div class="container footer-bottom-row">
            <p>Copyright © by NR Car Center 2020. All Rights Reserved.</p>
        </div>
    </div>
</footer>

<script>
    const pass = document.getElementById("pass");
    const cpass = document.getElementById("cpass");
    const togglePass = document.getElementById("togglePass");
    const toggleCPass = document.getElementById("toggleCPass");

    function toggle(input, btn){
      if(!input || !btn) return;
      btn.addEventListener("click", () => {
        input.type = input.type === "password" ? "text" : "password";
        btn.innerHTML = input.type === "password"
          ? '<i class="fa-regular fa-eye"></i>'
          : '<i class="fa-regular fa-eye-slash"></i>';
      });
    }
    toggle(pass, togglePass);
    toggle(cpass, toggleCPass);
</script>

</body>
</html>
