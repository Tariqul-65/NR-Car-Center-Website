spring.application.name=NR Car Center
server.port=8080
server.address=0.0.0.0

spring.datasource.url=jdbc:mysql://localhost:3306/car?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1200874

spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver



logging.level.org.hibernate.orm.jdbc.bind=TRACE

logging.level.org.hibernate.orm.jdbc.extract=TRACE
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.web.error.include-message=always
spring.web.error.include-binding-errors=always
spring.web.error.include-stacktrace=always

spring.servlet.multipart.enabled=true
spring.servlet.multipart.resolve-lazily=true
spring.servlet.multipart.file-size-threshold=2MB
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=200MB

server.tomcat.max-part-count=300
server.tomcat.max-http-form-post-size=200MB
server.tomcat.max-swallow-size=200MB

app.upload.dir=uploads
logging.level.org.springframework.security=DEBUG
spring.profiles.active=dev